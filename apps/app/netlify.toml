[build]
  command = "pnpm generate"
  publish = ".output/public"
  ignore = "bash scripts/netlify-ignore.sh app"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — ssr:false means all client routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "wake-lock=*, fullscreen=*"
