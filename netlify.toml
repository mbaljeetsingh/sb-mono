[build]
  command = "pnpm --filter @sb/app generate"
  publish = "apps/app/.output/public"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — Nuxt is ssr:false, so all client routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "wake-lock=*, fullscreen=*"
